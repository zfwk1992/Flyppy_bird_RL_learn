version: '3.8'

services:
  # GPU 版本 (需要 nvidia-docker2)
  flappy-bird-dqn:
    build: .
    container_name: flappy_bird_rl_gpu
    volumes:
      - ./logs:/app/logs
      - ./saved_networks:/app/saved_networks
      - ./assets:/app/assets
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    # 💪 合理的内存限制，充分利用32GB系统内存
    mem_limit: 28g  # 限制容器最大使用28GB内存，留4GB给系统
    memswap_limit: 30g  # 包括swap的总限制
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true

  # CPU 版本 (备用方案)
  flappy-bird-cpu:
    build: .
    container_name: flappy_bird_rl_cpu
    volumes:
      - ./logs:/app/logs
      - ./saved_networks:/app/saved_networks
      - ./assets:/app/assets
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    profiles:
      - cpu