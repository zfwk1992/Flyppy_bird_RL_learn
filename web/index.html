<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You vs. a Deep-RL Agent &mdash; Flappy Bird</title>
<style>
  :root {
    --ink:#e8ece4; --dim:#8b9384; --rule:#2a2f26; --bg:#0e110d; --panel:#141812;
    --you:#e0b341; --ai:#4fb0e0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; touch-action: manipulation;
  }
  #app {
    max-width: 900px; margin: 0 auto; padding: 14px 12px 24px;
    display: flex; flex-direction: column; gap: 12px;
  }
  header { text-align: center; }
  h1 { font-size: clamp(17px, 4.4vw, 26px); margin: 0 0 4px; letter-spacing: -.01em; }
  .tagline { font-size: clamp(11px, 2.8vw, 13px); color: var(--dim); margin: 0; }

  #arena { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .side {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
    padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  }
  .who {
    display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
    font-size: clamp(11px, 2.8vw, 13px); font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase;
  }
  .side.you .who { color: var(--you); }
  .side.ai  .who { color: var(--ai); }
  .who small { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--dim); }

  /* 画布是 288x512（宽高比 0.5625）。宽度跟随栏宽，但再按视口高度封顶，
     否则在笔记本上两块画布会把页脚顶出屏幕。0.5625 就是 288/512。 */
  .stage { position: relative; width: min(100%, calc(56vh * 0.5625)); margin: 0 auto; }
  canvas {
    display: block; width: 100%; height: auto; background: #000;
    image-rendering: pixelated; border-radius: 4px;
  }
  .live {
    position: absolute; top: 6px; left: 0; right: 0; text-align: center;
    font-size: clamp(20px, 6vw, 34px); font-weight: 800; pointer-events: none;
    font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 #000, 0 0 10px #000;
  }
  .side.you .live { color: var(--you); }
  .side.ai  .live { color: var(--ai); }
  .veil {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; text-align: center;
    background: rgba(0,0,0,.68); border-radius: 4px; padding: 8px;
    font-size: clamp(11px, 2.9vw, 14px); line-height: 1.45;
  }
  .veil[hidden] { display: none; }
  .veil b { font-size: clamp(13px, 3.4vw, 17px); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px;
           font-size: clamp(10px, 2.6vw, 12px); font-variant-numeric: tabular-nums; }
  .stats div { display: flex; justify-content: space-between; gap: 6px; color: var(--dim); }
  .stats b { color: var(--ink); font-weight: 600; }

  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
           gap: 8px 16px; font-size: 12px; color: var(--dim); text-align: center; }
  button {
    background: #1b2017; color: var(--ink); border: 1px solid var(--rule);
    border-radius: 5px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: #43503a; }
  kbd { background:#1b2017; border:1px solid var(--rule); border-radius:3px;
        padding:1px 6px; font-family: ui-monospace, Consolas, monospace; font-size:11px; }
  #boot { text-align: center; color: var(--dim); font-size: 13px; padding: 40px 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>You vs. a deep-RL agent</h1>
    <p class="tagline">Same game, same physics, same pipe sequence &mdash; and the agent sees only pixels.</p>
  </header>

  <div id="boot">loading the network (2.5&nbsp;MB)&hellip;</div>

  <div id="arena" hidden>
    <section class="side you">
      <div class="who"><span>You</span><small>tap / space</small></div>
      <div class="stage" id="youStage">
        <canvas id="youCanvas" width="288" height="512"></canvas>
        <div class="live" id="youLive">0</div>
        <div class="veil" id="youVeil"><b>Tap to fly</b><span>space, click or tap</span></div>
      </div>
      <div class="stats">
        <div><span>best</span><b id="youBest">0</b></div>
        <div><span>attempts</span><b id="youTries">0</b></div>
      </div>
    </section>

    <section class="side ai">
      <div class="who"><span>AI</span><small>pixels &rarr; Q</small></div>
      <div class="stage">
        <canvas id="aiCanvas" width="288" height="512"></canvas>
        <div class="live" id="aiLive">0</div>
      </div>
      <div class="stats">
        <div><span>best</span><b id="aiBest">0</b></div>
        <div><span>crashes</span><b id="aiDeaths">0</b></div>
      </div>
    </section>
  </div>

  <footer>
    <span><kbd>space</kbd> flap &middot; <kbd>R</kbd> restart</span>
    <button id="reseed">new pipe sequence</button>
    <span id="perf"></span>
  </footer>
</div>

<script type="module">
import { FlappyGame } from './game.js';
import { loadSprites, Renderer } from './render.js';
import { HITMASKS } from './assets/hitmasks.js';
import { createAi } from './ai.js';

const $ = (id) => document.getElementById(id);

// hitmasks 必须传：小鸟只有 72% 不透明，退化成包围盒会把擦边飞过误判成撞击。
// 见 web/tools/parity_game.md。两边共用同一个 seed，所以管道序列相同。
let seed = (Date.now() ^ (Math.random() * 0x7fffffff)) >>> 0;
const opts = () => ({ seed, hitmasks: HITMASKS });

let you = null, aiGame = null;
let youState = 'idle';          // idle | playing | dead
let flapQueued = false;
const best = { you: 0, ai: 0 };
const count = { tries: 0, deaths: 0 };

const [sprites, aiPlayer] = await Promise.all([loadSprites(), createAi()]);
const youRender = new Renderer($('youCanvas').getContext('2d'), sprites);
const aiRender = new Renderer($('aiCanvas').getContext('2d'), sprites);
$('boot').hidden = true;
$('arena').hidden = false;

function newYou() {
  you = new FlappyGame(opts());
  you.reset();
  flapQueued = false;
  $('youLive').textContent = '0';
}

function newAi() {
  aiGame = new FlappyGame(opts());
  aiGame.reset();
  aiPlayer.reset();
  $('aiLive').textContent = '0';
}

function setYouState(s) {
  youState = s;
  const veil = $('youVeil');
  if (s === 'playing') { veil.hidden = true; return; }
  veil.hidden = false;
  veil.innerHTML = s === 'idle'
    ? '<b>Tap to fly</b><span>space, click or tap</span>'
    : `<b>${you.score} pipe${you.score === 1 ? '' : 's'}</b>`
      + `<span>the AI is at ${aiGame.score} &mdash; tap to try again</span>`;
  $('youTries').textContent = String(count.tries);
}

// 一次输入同时承担三件事：开始、扇翅、重开。死后**立刻**重开、不放 Game Over
// 动画 —— plan.md 定了不削弱 AI，体验靠"秒重开"维持，任何停顿都会让人
// 失去再试一次的欲望。
function press() {
  if (youState === 'idle') { count.tries++; setYouState('playing'); }
  else if (youState === 'dead') { newYou(); count.tries++; setYouState('playing'); }
  flapQueued = true;
}

addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); press(); }
  else if (e.code === 'KeyR') { newYou(); count.tries++; setYouState('playing'); flapQueued = true; }
});
// pointerdown 而不是 click：click 在移动端有约 300ms 延迟，游戏受不了
$('youStage').addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });

$('reseed').addEventListener('click', () => {
  seed = (Date.now() ^ (Math.random() * 0x7fffffff)) >>> 0;
  newYou(); newAi(); setYouState('idle');
});

const STEP_MS = 1000 / 30;      // 与 play.py 的实时观看帧率一致
let acc = 0;
let last = performance.now();
let perfAcc = 0, perfN = 0;

function stepYou() {
  const action = flapQueued ? 1 : 0;
  flapQueued = false;
  if (you.step(action).done) {
    if (you.score > best.you) { best.you = you.score; $('youBest').textContent = String(best.you); }
    setYouState('dead');
  }
  $('youLive').textContent = String(you.score);
}

function stepAi() {
  // decide() 必须在 step() 之前 —— 观测的是当前这一帧的画面，与训练时序一致
  const action = aiPlayer.decide(aiGame);
  if (aiPlayer.lastMs) { perfAcc += aiPlayer.lastMs; perfN++; aiPlayer.lastMs = 0; }
  if (aiGame.step(action).done) {
    if (aiGame.score > best.ai) { best.ai = aiGame.score; $('aiBest').textContent = String(best.ai); }
    count.deaths++;
    $('aiDeaths').textContent = String(count.deaths);
    newAi();
    return;
  }
  $('aiLive').textContent = String(aiGame.score);
}

function tick(now) {
  const dt = now - last;
  last = now;
  // 切后台回来时 dt 可能是几秒，别让物理一次性追补上百帧
  acc = Math.min(acc + dt, STEP_MS * 4);
  while (acc >= STEP_MS) {
    acc -= STEP_MS;
    stepAi();                       // AI 一直在飞，玩家死了也不停
    if (youState === 'playing') stepYou();
  }
  youRender.draw(you.observeState());
  aiRender.draw(aiGame.observeState());
  if (perfN >= 30) {
    $('perf').textContent = `inference ${(perfAcc / perfN).toFixed(0)} ms / decision`;
    perfAcc = 0; perfN = 0;
  }
  requestAnimationFrame(tick);
}

newYou();
newAi();
setYouState('idle');
requestAnimationFrame(tick);
</script>
</body>
</html>
